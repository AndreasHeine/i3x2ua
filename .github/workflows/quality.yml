name: Quality Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

concurrency:
  # A newer push or PR update supersedes an in-progress run of the same workflow on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint the frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check the frontend
        # svelte-kit sync writes the tsconfig the check reads; the check covers .svelte components,
        # which the build alone does not verify.
        working-directory: frontend
        run: npm run check

      - name: Test the frontend
        # The built-in test runner of the interpreter, so the test gate adds no dependency to the
        # published app.
        working-directory: frontend
        run: npm run test

      - name: Audit the frontend dependencies
        # pip-audit covers the Python side; npm audit covers this one. The level is high because the
        # Svelte toolchain carries low-severity advisories upstream has not released a fix for, so a
        # gate on any advisory would block every run without reporting something actionable.
        working-directory: frontend
        run: npm run audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  import-linter:
    name: Import Linter
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run import-linter
        run: uv run lint-imports

  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        # docs/architecture.md requires "ruff check and format pass", so both the lint and the
        # format check are gated here.
        run: uv run ruff format --check .

  mypy:
    name: MyPy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run MyPy
        run: uv run mypy .

  pytest:
    name: Pytest + Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Codecov exchanges an OIDC token, so only this job may mint one; a workflow-level grant would
    # hand a token that can reach external systems to every lint job as well.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # 3.14 is the lower bound of requires-python, 3.15 is what the image ships (python:3.15.2-alpine).
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra otel --group dev --frozen

      - name: Run Pytest with Coverage
        # Gate thresholds live in scripts/check_coverage.py (shared with the local runner);
        # pytest only produces the report.
        run: uv run pytest -q

      - name: Check coverage gates
        run: uv run python scripts/check_coverage.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  # asyncua's classifiers stop at 3.13 and uvicorn's at 3.14 while the package claims 3.14-3.15 and
  # the image ships python:3.15.2-alpine, so both libraries run on an interpreter neither of them
  # declares. 3.13 is the highest interpreter both do declare, so the gateway's transport and
  # server-loop paths are exercised there too; scripts/check_interpreter_compatibility.py then
  # compares the claims with the interpreters CI runs and the image ships.
  interpreter-compatibility:
    name: Interpreter Compatibility (3.13 claim)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        # The suite serves the prerendered bundle from dist/; without it every page route answers
        # 404, so the compatibility run would fail on the pages instead of on the libraries.
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the declared dependencies
        # uv sync resolves against requires-python = ">=3.14,<3.16" and would refuse this
        # interpreter, so the job installs the dependency list from pyproject.toml rather than the
        # project itself: what is being verified is the libraries' claim, not the declared range.
        run: uv pip install --system --group dev -r pyproject.toml

      - name: Run the suite on the claimed interpreter
        # Coverage is measured by the matrix jobs, whose interpreters are the ones the image ships.
        run: python -m pytest -q -o addopts=""

      - name: Check the dependency interpreter claims
        run: python scripts/check_interpreter_compatibility.py

  # pyproject declares setuptools.build_meta, but nothing else in CI ever runs it: the published image
  # copies raw source rather than a built distribution, so a packaging mistake - a dropped subpackage, a
  # drifted requires-python, a license that stops shipping - would only be noticed by whoever installs
  # the published package. The same validator an operator can run locally is the gate here.
  package-build:
    name: Package Build + Metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # The validator reads pyproject.toml with tomllib; the lock decides which interpreter runs it.
        run: uv sync --frozen

      - name: Build the wheel and sdist
        run: uv build

      - name: Validate the distribution metadata
        # Compares the artifacts with pyproject.toml and with the source tree: name, version, summary,
        # requires-python, license classifier and license text, dependencies and extras, packaged
        # modules, wheel layout, and wheel/sdist agreement.
        run: uv run python scripts/check_package_metadata.py

      - name: Upload the built distribution
        # The artifacts are the evidence a reviewer inspects; nothing is published from this job.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: i3x2ua-dist
          path: dist

  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # The dev group is included so test-only packages are audited too; the lock is the
        # source of truth, so this audits exactly what the image and CI install.
        run: uv sync --group dev --frozen

      - name: Audit the locked environment
        # Audits every installed distribution against the PyPI advisory DB; a known CVE exits
        # non-zero, which is what makes SECURITY.md's claim checkable instead of aspirational.
        run: uv run pip-audit

  conformance:
    name: i3X Conformance (headless)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # The i3X submodule carries the conformance test tool (i3X/conformance-tests).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node.js
        # The test tool ships dependency-free (Node builtins only, engines >= 18.17), and 26 is the
        # Node the image builds the frontend with (node:26-alpine), so CI and the image agree.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run conformance suite
        # Starts the OPC UA fixture and the gateway, waits for readiness, runs i3x-test run;
        # fails unless the suite exits 0 and the verdict is "Full 1.0 Compliance".
        run: uv run python scripts/run_conformance_headless.py --json i3x-conformance-report-ci.json

      - name: Upload conformance report
        # The committed i3x-conformance-report.json stays untouched; CI evidence is an artifact.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: i3x-conformance-report
          path: i3x-conformance-report-ci.json

  # The plain run above exercises the i3X contract on the gateway's own HTTP port. TLS, Basic Auth
  # and the HTTP->HTTPS redirect belong to the proxy stack (nginx/entrypoint.sh), and nothing in
  # CI crosses them today: a broken auth or TLS config would ship unnoticed. This job brings the
  # repository's own proxy image up and runs the same suite through it.
  conformance-secured:
    name: i3X Conformance (secured HTTPS + Basic Auth)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # The proxy image and the i3X conformance tool both come from this checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node.js
        # The test tool ships dependency-free (Node builtins only, engines >= 18.17), and 26 is the
        # Node the proxy image builds its frontend stage with (node:26-alpine), so CI and image agree.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate development HTTPS certificate
        # TLS needs key material, and none of it may be committed: the same generator the local
        # deployment guide uses, writing into a git-ignored certificate directory.
        run: uv run python scripts/generate_https_dev_cert.py --out-dir certs/https-ci --ip 127.0.0.1

      - name: Build the nginx image
        # The stack CI exercises must be the stack operators deploy, so the image's entrypoint and
        # proxy config are the ones under test rather than CI-written variants.
        run: docker build -f nginx/Dockerfile -t i3x2ua-proxy-ci .

      - name: Start the proxy with TLS and Basic Auth
        # --network host shares the runner's network namespace, so the proxy reaches the gateway
        # on loopback. host-gateway would not: on Linux it is the docker bridge IP, and a gateway
        # bound to 127.0.0.1 never answers requests aimed at it (the run of 5cbd4a4 timed out
        # there; Docker Desktop masks the difference by forwarding host-gateway to localhost).
        # Ports come from the entrypoint env instead of -p mappings, which are meaningless in
        # host network mode. The edge limit stays configured but with a wide burst: the suite
        # issues faster than a deployment's 20r/s, and shedding its requests would fail the
        # contract check rather than the stack. The credentials are throwaway values for a
        # container that never leaves the runner.
        run: |
          docker run -d --name i3x2ua-proxy-ci \
            --network host \
            -v "$PWD/certs/https-ci:/etc/nginx/certs:ro" \
            -e NGINX_UPSTREAM_HOST=127.0.0.1 \
            -e NGINX_UPSTREAM_PORT=8000 \
            -e NGINX_SSL_CERTIFICATE=/etc/nginx/certs/fullchain.pem \
            -e NGINX_SSL_CERTIFICATE_KEY=/etc/nginx/certs/privkey.pem \
            -e NGINX_HTTPS_ENABLED=1 \
            -e NGINX_HTTP_PORT=8080 \
            -e NGINX_HTTPS_PORT=8443 \
            -e NGINX_HTTPS_REDIRECT_PORT=8443 \
            -e NGINX_BASIC_AUTH_ENABLED=1 \
            -e NGINX_BASIC_AUTH_USER=ci-user \
            -e NGINX_BASIC_AUTH_PASSWORD=ci-runner-local \
            -e NGINX_RATE_LIMIT_ENABLED=1 \
            -e NGINX_RATE_LIMIT_BURST=200 \
            -e NGINX_RATE_LIMIT_CONN_PER_CLIENT=64 \
            i3x2ua-proxy-ci

      - name: Assert HTTP redirects to HTTPS
        # nginx answers the redirect itself, so this holds before the gateway is even running.
        run: |
          outcome="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/v1/model)"
          echo "HTTP entrypoint answered: $outcome"
          code="${outcome%% *}"
          target="${outcome#* }"
          if [ "$code" != "301" ]; then
            echo "expected 301, got $code"
            exit 1
          fi
          case "$target" in
            https:*8443*) ;;
            *) echo "redirect target is not the HTTPS entrypoint: $target"; exit 1 ;;
          esac

      - name: Assert unauthenticated API access is refused
        # /v1/info stays public because i3X requires it; every other route must answer 401.
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --insecure https://127.0.0.1:8443/v1/model)"
          echo "unauthenticated /v1/model answered: $code"
          if [ "$code" != "401" ]; then
            echo "expected 401, got $code"
            exit 1
          fi

      - name: Run conformance suite through the proxy
        # Fixture and gateway on the runner host; the suite is pointed at the TLS endpoint with
        # credentials for the auth layer and --insecure for the self-signed development certificate.
        run: |
          uv run python scripts/run_conformance_headless.py \
            --scheme https --public-host 127.0.0.1 --public-port 8443 \
            --basic ci-user:ci-runner-local --insecure \
            --json i3x-conformance-report-ci-secured.json

      - name: Stop the proxy
        # The container holds published ports; a failing suite must not leave it behind.
        if: always()
        run: docker rm -f i3x2ua-proxy-ci

      - name: Upload secured conformance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: i3x-conformance-report-secured
          path: i3x-conformance-report-ci-secured.json
