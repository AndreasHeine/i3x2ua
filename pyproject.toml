[project]
name = "i3x2ua"
version = "1.18.0"
description = "The i3X API Gateway for OPC UA"
license = { file = "LICENSE" }
requires-python = ">=3.14,<3.16"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "asyncua==2.1.0",
    "fastapi==0.162.5",
    "jsonschema[format]>=4.23.0",
    "pydantic==2.14.3",
    "pydantic-settings>=2.7.0",
    "uvicorn>=0.54,<0.55",
]

[project.urls]
Repository = "https://github.com/AndreasHeine/i3x2ua"
Commercial-Licensing = "https://github.com/sponsors/AndreasHeine"

[project.optional-dependencies]
otel = [
    "fastapi[opentelemetry]==0.162.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["i3x_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--cov=i3x_server",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
# ``api/v1`` helper modules are deliberately *not* omitted: the route modules import their
# behaviour, so the shared helpers must be measured with the routes that call them.
# ``infrastructure/opcua/client.py`` stays omitted with justification: it is the real asyncua
# adapter (transport, subscriptions, browse) and is only exercised against a live OPC UA server;
# the unit suites drive the fake client, so instrumenting it would measure unreachable branches.
# Branch coverage is measured so error-handling branches (the asyncua boundary, retry paths,
# validation failures) are visible and gated, not just line counts.
branch = true
omit = [
    "i3x_server/infrastructure/opcua/client.py",
    "i3x_server/__init__.py",
    "i3x_server/api/__init__.py",
    "i3x_server/api/mcp/__init__.py",
    "i3x_server/api/v1/__init__.py",
    "i3x_server/main.py",
]

[tool.ruff]
line-length = 120
# Deliberately the lowest supported interpreter, not the shipped 3.15: a newer target activates
# UP017/UP035/UP043/UP046/UP047 (110 findings) and, with ruff 0.17, mis-formats
# `except (A, B):` under a py314 target. The CI jobs pin the interpreter itself to 3.14/3.15.
target-version = "py310"
extend-exclude = ["i3X"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["i3x_server", "tests", "run.py", "run_tests.py"]
exclude = "(^|[\\/])i3X[\\/]demo[\\/]"

[dependency-groups]
dev = [
    # Only the test suite needs an HTTP client (TestClient plus the ASGITransport-based
    # tests). httpx2 is what Starlette's TestClient prefers; httpx is deprecated for it.
    # The gateway itself encodes query strings with the stdlib.
    "httpx2>=2.16.0",
    "import-linter>=2.4.0",
    "mypy>=1.10.0",
    # Supply-chain audit of the locked environment (CI quality job).
    "pip-audit>=2.7.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
]
