worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format upstream_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent rt=$request_time '
    'ua="$upstream_addr" us="$upstream_status" '
    'uct="$upstream_connect_time" uht="$upstream_header_time" '
    'urt="$upstream_response_time" conn=$connection '
    'conn_reqs=$connection_requests';

  # Every request is logged, successful ones included: SECURITY.md promises an audit trail, and
  # the gateway logs its own request lines at INFO only, which the compose default (WARN)
  # suppresses. The proxy is therefore the record of what was asked for; the format keeps the
  # upstream timing so a slow or failed request is explainable from one line.
  access_log /dev/stdout upstream_timing;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  server_tokens off;

  # Edge admission control (docs/NGINX_CONFIGURATION_REFERENCE.md, README reverse-proxy table).
  # The app has no per-client limiter unless I3X_REQUEST_RATE_LIMIT_PER_MINUTE is set, so the
  # proxy bounds one client's request rate and its concurrent connections. Both are keyed on the
  # connecting address: behind another proxy every request shares that proxy's address, so the
  # limit must be applied there instead (same caveat as the app's limiter, see http_rate_limit).
  # The zones are declared here because they must live in the http context; entrypoint.sh applies
  # them in the server blocks unless NGINX_RATE_LIMIT_ENABLED=0.
  limit_req_zone $binary_remote_addr zone=i3x_client:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=i3x_conn:10m;
  # 429 matches the status the app's own limiter answers with, so a tripped edge limit looks the
  # same to a client as a tripped app limit.
  limit_req_status 429;
  limit_conn_status 429;

  # Bulk write/update requests carry up to MAX_BULK_ITEMS (500) items per call.
  # nginx's 1 MiB default would reject them with 413 before the app can validate
  # the payload, so the edge limit is raised well above the largest legal body.
  client_max_body_size 8m;

  include /etc/nginx/conf.d/*.conf;
}
