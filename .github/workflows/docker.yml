name: Docker Build and Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag eines bestehenden Releases, das gebaut werden soll"
        required: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64/v8
  # Event payload values are handed to the shell as environment variables. `${{ }}` inside a script
  # substitutes text before the runner executes it, so payload text that contains shell metacharacters
  # would become code; the dispatch tag is caller-typed and also selects the checkout ref and the
  # published Docker tag, so it is validated against a plain tag name before anything consumes it.
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_TAG: ${{ github.event.inputs.tag }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REF_NAME: ${{ github.ref_name }}
  CHECKOUT_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  build-and-push:
    # Runner version pinned (not `ubuntu-latest`): a runner image change must not silently
    # alter the build or the scan toolchain.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # One build per ref at a time: concurrent pushes to master would race on the same
    # `:master` tag and interleave GHA cache writes.
    concurrency:
      group: docker-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Validate dispatch tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          # The dispatched tag selects the checkout ref and the published Docker tag, so it must be a
          # plain tag name: no slashes, quotes, spaces, shell metacharacters or leading dash (git would
          # read that as an option). Anything else fails here, before the checkout or tag list can act
          # on it.
          if [[ ! "$DISPATCH_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid dispatch tag: '$DISPATCH_TAG' is not a plain tag name"
            exit 1
          fi
          echo "Dispatch tag accepted: $DISPATCH_TAG"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A dispatched build must publish the code of the tag it names, not the default branch:
          # otherwise the image is built from master but tagged and stamped with the older release.
          # The value comes from env, and the step above has already rejected malformed tags.
          ref: ${{ env.CHECKOUT_REF }}

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ github.event_name != 'pull_request' }}
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'release' && github.event.action == 'published' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.action == 'published' }}
            type=raw,value=${{ env.DISPATCH_TAG }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64,amd64

      - name: Resolve lowercase image reference
        id: image_ref
        shell: bash
        run: |
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Determine server build version
        id: build_version
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            value="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            value="$DISPATCH_TAG"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            value="pr-${PR_NUMBER}"
          else
            value="$REF_NAME"
          fi

          value="${value#refs/tags/}"
          if [[ -z "${value}" ]]; then
            value="master"
          fi

          echo "build_version=${value}" >> "$GITHUB_OUTPUT"
          echo "Resolved BUILD_VERSION=${value}"

      # The image is scanned *before* anything is published: a vulnerable build must never
      # reach the registry, so the pushable multi-platform build only runs after the gate.
      # `--load` only supports a single platform, so the scan image is built for amd64 only.
      - name: Build image for scanning (no push)
        id: scan_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.build_version.outputs.build_version }}
            INSTALL_OTEL=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Unfixed findings stay visible: a distribution package with no released fix is
          # exactly the case a report must not hide.
          ignore-unfixed: false

      - name: Upload vulnerability scan results
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on critical vulnerabilities
        # Runs on pull requests as well, so a dependency that introduces a CRITICAL CVE is
        # caught before the image exists in the registry at all.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Build Docker image (push on non-PR events)
        if: ${{ github.event_name != 'pull_request' }}
        # The registry image ships the optional OTel SDK/exporter, so `I3X_OTEL_ENABLED=true` as
        # docker-compose.yml advertises it is truthful for pulls of the published image and not
        # only for local builds. The scan build above passes the same arg, so Trivy sees exactly
        # the dependencies that are published.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            BUILD_VERSION=${{ steps.build_version.outputs.build_version }}
            INSTALL_OTEL=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
