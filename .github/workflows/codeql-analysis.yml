name: CodeQL Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  # Catch advisories in code that no PR touched (supply-chain drift).
  schedule:
    - cron: "21 5 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Python covers the gateway; JavaScript covers the frontend and the static pages.
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        # Neither language needs a build step: the Python package is pure source and the
        # frontend is analyzed from its TypeScript sources.
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
