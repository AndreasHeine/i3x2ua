x-i3x2ua-environment: &i3x2ua-environment
  I3X_OPCUA_ENDPOINT: opc.tcp://opcua.umati.app:4843  # OPC UA server endpoint URL.
  # I3X_OPCUA_USERNAME: ""  # Optional OPC UA username.
  # I3X_OPCUA_PASSWORD: ""  # Optional OPC UA password.
  # I3X_OPCUA_SECURITY_MODE: SignAndEncrypt
  # I3X_OPCUA_SECURITY_POLICY: Basic256Sha256
  # I3X_OPCUA_CLIENT_CERT_PATH: ./certs/opcua-client-sample/client-cert.pem
  # I3X_OPCUA_CLIENT_KEY_PATH: ./certs/opcua-client-sample/client-key.pem
  # I3X_OPCUA_CLIENT_KEY_PASSWORD: ""  # Optional password for client key.
  # I3X_OPCUA_SERVER_CERT_PATH: ""  # Optional pinned server certificate path.
  I3X_OPCUA_BROWSE_CONCURRENCY: 128
  # I3X_OPCUA_BROWSE_ROOTS: '["nsu=urn:example:plant;s=Machine1","nsu=urn:example:plant;s=Machine2"]'
  I3X_OPCUA_METADATA_CACHE_TTL_SECONDS: 300
  I3X_MODEL_REFRESH_INTERVAL_SECONDS: 60
  I3X_SUBSCRIPTION_INTERVAL_SECONDS: 1
  I3X_SUBSCRIPTION_MAX_UPDATES: 10000
  I3X_SUBSCRIPTION_TTL_SECONDS: 300
  I3X_LOG_LEVEL: INFO
  # I3X_CORS_ALLOWED_ORIGINS: "[]"  # JSON array of allowed origins.
  I3X_OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: i3x2ua
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  I3X_ENABLE_MCP: 1
  I3X_ENABLE_WRITES: 1
  I3X_OPCUA_CERTS_DIR: ./certs

x-i3x2ua-common: &i3x2ua-common
  build:
    context: ../../..
    args:
      INSTALL_OTEL: "true"
  image: i3x2ua-local
  restart: unless-stopped
  environment: *i3x2ua-environment
  volumes:
    - ../../../certs:/app/certs:ro
    - ../../../overrides:/app/overrides:ro
  expose:
    - "8000"
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
    - /home/app:size=16m,noexec,nosuid
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/info', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  networks:
    - backend

services:
  i3x2ua-discovery:
    <<: *i3x2ua-common
    container_name: i3x2ua-discovery
    command:
      - python
      - -m
      - uvicorn
      - i3x_server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --workers
      - "${I3X2UA_DISCOVERY_WORKERS:-2}"
    environment:
      <<: *i3x2ua-environment
      OTEL_SERVICE_NAME: i3x2ua-discovery

  i3x2ua-subscriptions:
    <<: *i3x2ua-common
    container_name: i3x2ua-subscriptions
    command:
      - python
      - -m
      - uvicorn
      - i3x_server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --workers
      - "1"
    environment:
      <<: *i3x2ua-environment
      OTEL_SERVICE_NAME: i3x2ua-subscriptions

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: i3x2ua-jaeger
    restart: unless-stopped
    command:
      - "--memory.max-traces=10000"
    depends_on:
      i3x2ua-discovery:
        condition: service_healthy
      i3x2ua-subscriptions:
        condition: service_healthy
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - backend

  nginx:
    build:
      context: ./nginx
    container_name: i3x2ua-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      i3x2ua-discovery:
        condition: service_healthy
      i3x2ua-subscriptions:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      NGINX_UPSTREAM_HOST: i3x2ua-discovery
      NGINX_UPSTREAM_PORT: 8000
      NGINX_SUBSCRIPTION_UPSTREAM_HOST: i3x2ua-subscriptions
      NGINX_SUBSCRIPTION_UPSTREAM_PORT: 8000
      NGINX_SERVER_NAME: _
      NGINX_HTTPS_ENABLED: 1
      NGINX_HTTPS_REDIRECT_PORT: 8443
      NGINX_SSL_CERTS_DIR: ../../../certs
      NGINX_SSL_CERTIFICATE: /etc/nginx/certs/https-sample/fullchain.pem
      NGINX_SSL_CERTIFICATE_KEY: /etc/nginx/certs/https-sample/privkey.pem
      NGINX_BASIC_AUTH_ENABLED: 1
      NGINX_BASIC_AUTH_USER: admin
      NGINX_BASIC_AUTH_PASSWORD: pw1
      NGINX_BASIC_AUTH_REALM: i3x2ua
    volumes:
      - ../../../certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
      - /etc/nginx/conf.d:size=1m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - backend

networks:
  backend:
    driver: bridge
