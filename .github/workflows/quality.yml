name: Quality Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read
  id-token: write

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  import-linter:
    name: Import Linter
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run import-linter
        run: uv run lint-imports

  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        # docs/architecture.md promises "ruff check and format pass"; only the lint ran.
        run: uv run ruff format --check .

  mypy:
    name: MyPy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run MyPy
        run: uv run mypy .

  pytest:
    name: Pytest + Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 3.14 is the lower bound of requires-python, 3.15 is what the image ships (python:3.15.2-alpine).
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra otel --group dev --frozen

      - name: Run Pytest with Coverage
        # Gate thresholds live in scripts/check_coverage.py (shared with the local runner);
        # pytest only produces the report.
        run: uv run pytest -q

      - name: Check coverage gates
        run: uv run python scripts/check_coverage.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # The dev group is included so test-only packages are audited too; the lock is the
        # source of truth, so this audits exactly what the image and CI install.
        run: uv sync --group dev --frozen

      - name: Audit the locked environment
        # Audits every installed distribution against the PyPI advisory DB; a known CVE exits
        # non-zero, which is what makes SECURITY.md's claim checkable instead of aspirational.
        run: uv run pip-audit

  conformance:
    name: i3X Conformance (headless)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # The i3X submodule carries the conformance test tool (i3X/conformance-tests).
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        # The test tool ships dependency-free (Node builtins only, engines >= 18.17);
        # 24 matches the builder stage of the Dockerfile.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run conformance suite
        # Starts the OPC UA fixture and the gateway, waits for readiness, runs i3x-test run;
        # fails unless the suite exits 0 and the verdict is "Full 1.0 Compliance".
        run: uv run python scripts/run_conformance_headless.py --json i3x-conformance-report-ci.json

      - name: Upload conformance report
        # The committed i3x-conformance-report.json stays untouched; CI evidence is an artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i3x-conformance-report
          path: i3x-conformance-report-ci.json
