x-i3x2ua-common: &i3x2ua-common
  image: ${I3X2UA_IMAGE:-ghcr.io/andreasheine/i3x2ua:master}
  restart: unless-stopped
  command:
    - python
    - -m
    - uvicorn
    - i3x_server.main:app
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --proxy-headers
    - --forwarded-allow-ips
    - "*"
    - --workers
    - "1"
  environment:
    I3X_LOG_LEVEL: ${I3X_LOG_LEVEL:-INFO}
    I3X_OPCUA_SECURITY_MODE: ${I3X_OPCUA_SECURITY_MODE:-None}
    I3X_OPCUA_SECURITY_POLICY: ${I3X_OPCUA_SECURITY_POLICY:-}
    I3X_OPCUA_BROWSE_CONCURRENCY: ${I3X_OPCUA_BROWSE_CONCURRENCY:-128}
  expose:
    - "8000"
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
    - /home/app:size=16m,noexec,nosuid
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/info', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  networks:
    - backend

services:
  i3x2ua-1:
    <<: *i3x2ua-common
    container_name: i3x2ua-1
    environment:
      I3X_OPCUA_ENDPOINT: ${I3X_OPCUA_ENDPOINT_1:?Set I3X_OPCUA_ENDPOINT_1 in .env}
      I3X_OPCUA_USERNAME: ${I3X_OPCUA_USERNAME_1:-}
      I3X_OPCUA_PASSWORD: ${I3X_OPCUA_PASSWORD_1:-}
      I3X_LOG_LEVEL: ${I3X_LOG_LEVEL:-INFO}
      I3X_OPCUA_SECURITY_MODE: ${I3X_OPCUA_SECURITY_MODE_1:-None}
      I3X_OPCUA_SECURITY_POLICY: ${I3X_OPCUA_SECURITY_POLICY_1:-}
      I3X_OPCUA_BROWSE_CONCURRENCY: ${I3X_OPCUA_BROWSE_CONCURRENCY:-128}

  i3x2ua-2:
    <<: *i3x2ua-common
    container_name: i3x2ua-2
    environment:
      I3X_OPCUA_ENDPOINT: ${I3X_OPCUA_ENDPOINT_2:?Set I3X_OPCUA_ENDPOINT_2 in .env}
      I3X_OPCUA_USERNAME: ${I3X_OPCUA_USERNAME_2:-}
      I3X_OPCUA_PASSWORD: ${I3X_OPCUA_PASSWORD_2:-}
      I3X_LOG_LEVEL: ${I3X_LOG_LEVEL:-INFO}
      I3X_OPCUA_SECURITY_MODE: ${I3X_OPCUA_SECURITY_MODE_2:-None}
      I3X_OPCUA_SECURITY_POLICY: ${I3X_OPCUA_SECURITY_POLICY_2:-}
      I3X_OPCUA_BROWSE_CONCURRENCY: ${I3X_OPCUA_BROWSE_CONCURRENCY:-128}

  i3x2ua-3:
    <<: *i3x2ua-common
    container_name: i3x2ua-3
    environment:
      I3X_OPCUA_ENDPOINT: ${I3X_OPCUA_ENDPOINT_3:?Set I3X_OPCUA_ENDPOINT_3 in .env}
      I3X_OPCUA_USERNAME: ${I3X_OPCUA_USERNAME_3:-}
      I3X_OPCUA_PASSWORD: ${I3X_OPCUA_PASSWORD_3:-}
      I3X_LOG_LEVEL: ${I3X_LOG_LEVEL:-INFO}
      I3X_OPCUA_SECURITY_MODE: ${I3X_OPCUA_SECURITY_MODE_3:-None}
      I3X_OPCUA_SECURITY_POLICY: ${I3X_OPCUA_SECURITY_POLICY_3:-}
      I3X_OPCUA_BROWSE_CONCURRENCY: ${I3X_OPCUA_BROWSE_CONCURRENCY:-128}

  nginx:
    build:
      context: ./nginx
    container_name: i3x2ua-nginx
    restart: unless-stopped
    depends_on:
      i3x2ua-1:
        condition: service_healthy
      i3x2ua-2:
        condition: service_healthy
      i3x2ua-3:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_SSL_CERTS_DIR:-../../../certs}:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/run:size=32m,noexec,nosuid
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /etc/nginx/conf.d:size=1m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - backend

networks:
  backend:
    driver: bridge
