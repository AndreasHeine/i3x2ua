name: DCO Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  dco:
    name: Verify Signed-off-by trailers
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO sign-offs
        shell: bash
        run: |
          set -euo pipefail

          is_allowed_bot_commit() {
            local sha="$1"
            local author_name author_email committer_name committer_email
            author_name="$(git log -1 --pretty=%an "${sha}")"
            author_email="$(git log -1 --pretty=%ae "${sha}")"
            committer_name="$(git log -1 --pretty=%cn "${sha}")"
            committer_email="$(git log -1 --pretty=%ce "${sha}")"

            # Dependabot/Renovate bot commits are machine-authored and cannot always include DCO trailers.
            if [[ "${author_name}" =~ ^(dependabot\[bot\]|renovate\[bot\]|Renovate Bot)$ ]] || \
               [[ "${committer_name}" =~ ^(dependabot\[bot\]|renovate\[bot\]|Renovate Bot)$ ]] || \
               [[ "${author_email}" =~ (dependabot\[bot\]|renovate\[bot\])@users\.noreply\.github\.com$ ]] || \
               [[ "${committer_email}" =~ (dependabot\[bot\]|renovate\[bot\])@users\.noreply\.github\.com$ ]]; then
              return 0
            fi

            return 1
          }

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            echo "Checking commit range: ${range}"
            mapfile -t commits < <(git rev-list --no-merges "${range}")
          else
            before="${{ github.event.before }}"
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]]; then
              range="${before}..${{ github.sha }}"
              echo "Checking commit range: ${range}"
              mapfile -t commits < <(git rev-list --no-merges "${range}")
            else
              # A first push or a force push has no boundary ("before" is zero). A bare range would
              # list every ancestor of the branch, so historic unsigned commits would fail the
              # check regardless of the new ones. Only the commits carried by the event are new;
              # the push payload lists at most the last 20 commits.
              echo "No push boundary available; checking the commits carried by the event."
              mapfile -t commits < <(jq -r '.commits[] | .id' "${GITHUB_EVENT_PATH}")
            fi
          fi

          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "No commits to verify."
            exit 0
          fi

          failed=0
          for sha in "${commits[@]}"; do
            # Merge commits carry no trailer of their own (the pushed PR commits are checked separately).
            if [[ "$(git rev-list --parents -n 1 "${sha}" | wc -w)" -gt 2 ]]; then
              echo "Skipping merge commit ${sha}"
              continue
            fi

            author_name="$(git log -1 --pretty=%an "${sha}")"
            author_email="$(git log -1 --pretty=%ae "${sha}")"

            if [[ "${author_name}" =~ \[bot\]$ || "${author_email}" =~ \[bot\]@users\.noreply\.github\.com$ ]]; then
              echo "Skipping bot commit ${sha} (${author_name} <${author_email}>)"
              continue
            fi

            if ! git log -1 --pretty=%B "${sha}" | grep -Eiq '^Signed-off-by:\s+.+<.+>$'; then
              if is_allowed_bot_commit "${sha}"; then
                echo "Skipping DCO trailer check for allowed bot commit ${sha}"
                continue
              fi
              echo "Missing Signed-off-by trailer in commit ${sha}"
              failed=1
            fi
          done

          if [[ ${failed} -ne 0 ]]; then
            echo "DCO check failed. Amend commits with: git commit --amend -s"
            exit 1
          fi

          echo "DCO check passed."
