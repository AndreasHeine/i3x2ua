worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format upstream_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent rt=$request_time '
    'ua="$upstream_addr" us="$upstream_status" '
    'uct="$upstream_connect_time" uht="$upstream_header_time" '
    'urt="$upstream_response_time" conn=$connection '
    'conn_reqs=$connection_requests';

  access_log /dev/stdout upstream_timing;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  server_tokens off;

  upstream instance1_backend {
    server i3x2ua-1:8000;
    keepalive 32;
  }

  upstream instance2_backend {
    server i3x2ua-2:8000;
    keepalive 32;
  }

  upstream instance3_backend {
    server i3x2ua-3:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/https-sample/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/https-sample/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /i3x/instance1 {
      return 308 /i3x/instance1/;
    }

    location = /i3x/instance1/v1/subscriptions/stream {
      rewrite ^/i3x/instance1/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://instance1_backend;
    }

    location ^~ /i3x/instance1/ {
      rewrite ^/i3x/instance1/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://instance1_backend;
    }

    location = /i3x/instance2 {
      return 308 /i3x/instance2/;
    }

    location = /i3x/instance2/v1/subscriptions/stream {
      rewrite ^/i3x/instance2/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://instance2_backend;
    }

    location ^~ /i3x/instance2/ {
      rewrite ^/i3x/instance2/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://instance2_backend;
    }

    location = /i3x/instance3 {
      return 308 /i3x/instance3/;
    }

    location = /i3x/instance3/v1/subscriptions/stream {
      rewrite ^/i3x/instance3/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://instance3_backend;
    }

    location ^~ /i3x/instance3/ {
      rewrite ^/i3x/instance3/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://instance3_backend;
    }

    location / {
      return 404;
    }
  }
}
