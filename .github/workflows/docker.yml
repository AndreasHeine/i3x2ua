name: Docker Build and Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag eines bestehenden Releases, das gebaut werden soll"
        required: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  build-and-push:
    # Runner version pinned (not `ubuntu-latest`): a runner image change must not silently
    # alter the build or the scan toolchain.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # One build per ref at a time: concurrent pushes to master would race on the same
    # `:master` tag and interleave GHA cache writes.
    concurrency:
      group: docker-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A dispatched build must publish the code of the tag it names, not the default branch:
          # otherwise the image is built from master but tagged and stamped with the older release.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ github.event_name != 'pull_request' }}
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'release' && github.event.action == 'published' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.action == 'published' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Resolve lowercase image reference
        id: image_ref
        shell: bash
        run: |
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Determine server build version
        id: build_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            value="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            value="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            value="pr-${{ github.event.pull_request.number }}"
          else
            value="${{ github.ref_name }}"
          fi

          value="${value#refs/tags/}"
          if [[ -z "${value}" ]]; then
            value="master"
          fi

          echo "build_version=${value}" >> "$GITHUB_OUTPUT"
          echo "Resolved BUILD_VERSION=${value}"

      # The image is scanned *before* anything is published: a vulnerable build must never
      # reach the registry, so the pushable multi-platform build only runs after the gate.
      # `--load` only supports a single platform, so the scan image is built for amd64 only.
      - name: Build image for scanning (no push)
        id: scan_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.build_version.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Unfixed findings stay visible: a distribution package with no released fix is
          # exactly the case a report must not hide.
          ignore-unfixed: false

      - name: Upload vulnerability scan results
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on critical vulnerabilities
        # Runs on pull requests as well, so a dependency that introduces a CRITICAL CVE is
        # caught before the image exists in the registry at all.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.name }}:scan-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Build Docker image (push on non-PR events)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            BUILD_VERSION=${{ steps.build_version.outputs.build_version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
